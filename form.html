<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
        <form action="#" name="my Form" target="_self" method="get">
            <label for="name">UserName:</label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name" required>
            <br><br>

            <label for="DOB">DOB:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
            <input type="date" name="dob" id="dob" >
            <br><br>

            <label for="Password">Password:&nbsp;&nbsp;</label>
            <input type="password" name="pass" id="pass" placeholder="Enter Your Password" required>
            <br><br>

            <label for="Email">Email:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
            <input type="email" name="email" id="Email" placeholder="Enter your Email">
            <br><br>

            <label for="gender">Gender:</label>

            <input type="radio" name="gender" id="gender" >
            <label for="gender">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label>
            <br><br>

            <label for="hobbies">Hobbies:</label>
            
            <input type="checkbox" name="hobby1" id="hobby1">
            <label for="hobbies">cricket</label>
            <input type="checkbox" name="hobby2" id="hobby2">
            <label for="hobbies">Football</label>
            <br><br>

            <label for="lang">Select Programming Language</label>
            <select name="lang" id="lang"> 
                <option value="">Select Language</option> 
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
            </select>


        </form>
    </fieldset>
    
</body>
</html>
